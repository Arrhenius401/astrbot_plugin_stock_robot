name: astrbot_plugin_stock_robot
display_name: 股票分析助手
short_desc: 在 AstrBot 聊天中分析 A 股/港股/美股个股、A 股/港股指数与黄金市场观察，默认获取客观数据研报，可按需启用评分与 AI 解读。
desc: |
  在聊天中获取 A 股、港股、美股个股研报、A 股及港股指数研报，或黄金简报。可在插件配置中开启额外分析，个股另获得五维评分、行业同期对比、规则信号与 AI 解读，指数获得规则判断与 AI 解读。美股支持已核实的 TTM 同行经营比较，额外分析开启后提供有效维度评分与 AI 解读；财务、技术、估值和行业四维均计分且充分时才生成规则信号，缺项保持 N/A，不提供仓位或买卖动作建议。完整报告以图片发送到聊天中，方便阅读和分享。
version: 1.3.4
author: Arrhenius401
repo: https://github.com/Arrhenius401/astrbot_plugin_stock_robot
astrbot_version: ">=4.27.0"  # 开发与验证基线 4.27.0
