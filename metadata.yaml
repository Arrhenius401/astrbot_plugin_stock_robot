name: astrbot_plugin_stock_robot
display_name: 股票分析助手
short_desc: 在聊天中分析股票与指数，获取完整研报图片。
desc: |
  发送股票或指数名称、代码，即可获取分析研报。支持 A 股个股与指数分析，结合市场数据、指标与 AI 解读，帮助你了解标的表现。完整报告以图片发送到聊天中，方便阅读和分享。
version: 1.0.1
author: Arrhenius401
