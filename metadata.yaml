name: astrbot_plugin_stock_robot
display_name: 股票分析助手
short_desc: 聊天查股票、看指数，分析研报直接发图片
desc: |
  想了解一只股票或一个指数？把名称或代码发给机器人，就能在聊天中收到分析研报。
  支持 A 股个股与指数分析，完整报告以图片呈现，方便阅读和分享。

  首次使用会自动安装并启动 Stock Robot 分析服务，也可以连接你已部署的服务。
version: 1.0.0
author: Arrhenius401
repo: https://github.com/Arrhenius401/astrbot_plugin_stock_robot
astrbot_version: ">=4.27,<5"  # 开发与验证基线 4.27.4
