name: astrbot_plugin_stock_robot
display_name: 股票分析助手
short_desc: 在 AstrBot 聊天中分析 A 股/港股/美股个股、A 股/港股指数与黄金市场观察，默认获取客观数据研报，可按需启用评分与 AI 解读。
desc: |
  在聊天中获取 A 股、港股、美股个股研报、A 股及已验证目录中的港股指数研报，或黄金市场观察简报。完整报告以图片发送，图片失败时提供文件。
  默认提供客观数据，可在插件配置中开启“额外分析”，为个股增加有效维度评分、行业比较与 AI 解读，为指数增加规则判断与 AI 解读。
  美股支持已核实的最近十二个月（TTM）同行经营比较；仅财务、技术、估值和行业四维均计分且数据充分时生成规则信号，不提供仓位或买卖动作建议。财务缺项显示部分可用，未证实的数据保持不适用。
  港股指数按目录覆盖提供分析，名称有歧义时需选择具体代码；美股指数暂不开放。A 股报告增加主营简介，个股报告优化结构化综合研判、数据日期与缺失说明。
version: 1.3.0
author: Arrhenius401
repo: https://github.com/Arrhenius401/astrbot_plugin_stock_robot
astrbot_version: ">=4.27.0"  # 开发与验证基线 4.27.0
