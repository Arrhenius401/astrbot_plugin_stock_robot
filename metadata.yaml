name: astrbot_plugin_stock_robot
display_name: 股票分析助手
short_desc: 在 AstrBot 聊天中分析 A 股/港股个股、A 股指数与黄金市场观察，默认获取客观数据研报，可按需启用评分与 AI 解读。
desc: |
  发送股票、指数或黄金请求，即可获取 A 股/港股个股、A 股指数研报或黄金市场观察简报。个股与指数默认提供行情、财报、新闻和可复核指标；可在插件配置中开启额外分析，个股另获得五维评分、行业同期对比、规则信号与 AI 解读，指数获得规则判断与 AI 解读。完整报告以图片发送到聊天中，方便阅读和分享。
version: 1.2.3
author: Arrhenius401
repo: https://github.com/Arrhenius401/astrbot_plugin_stock_robot
astrbot_version: ">=4.27.0"  # 开发与验证基线 4.27.0
