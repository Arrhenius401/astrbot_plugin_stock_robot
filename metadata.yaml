name: astrbot_plugin_stock_robot
display_name: 股票分析助手
short_desc: 在聊天里获取个股/指数研报图片
desc: |
  把 stock_robot 的个股与指数分析能力封装为 AstrBot 的 LLM 工具。
  用户询问某只股票或指数时，插件调用本机部署的 stock_robot 服务完成分析，
  并把完整研报渲染为图片直接发送。

  支持复用已有服务，或在本机回环地址后台准备独立服务（见 README）。
version: 1.1.0
author: Arrhenius401
repo: https://github.com/Arrhenius401/astrbot_plugin_stock_robot
astrbot_version: ">=4.27,<5"  # 开发与验证基线 4.27.4
