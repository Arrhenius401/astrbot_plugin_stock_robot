name: astrbot_plugin_stock_robot
display_name: 股票分析助手
short_desc: 在 AstrBot 聊天中分析 A 股/港股个股与 A 股指数，获取五维评分与行业对比研报图片。
desc: |
  发送股票或指数名称、代码，即可获取 A 股/港股个股与 A 股指数研报。报告包含五维综合评分、行业同期对比和 AI 综合解读，完整报告以图片发送到聊天中，方便阅读和分享。
version: 1.1.2
author: Arrhenius401
repo: https://github.com/Arrhenius401/astrbot_plugin_stock_robot
astrbot_version: ">=4.27,<5"  # 开发与验证基线 4.27.4
